<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Screen layout</title>
<!--
  PROTOTYPE, throwaway. Ticket: .scratch/drum-app-v1/issues/10-screen-layout.md
  Four structurally different laptop layouts, switchable via ?variant=A|B|C|D and the floating bar
  (Alt+← / Alt+→). All four drive the same in-memory exercise library, editor and playback:
    A  Workstation      library sidebar | notation over editor + palette | settings sidebar  (stacked)
    B  Practice / Edit  two modes that replace each other; library in a drawer                (replacing)
    C  Score first      beat boxes sit under the notation itself; palette shows in Insert mode;
                        settings in header pop-overs; library is its own screen               (merged)
    D  Side by side     notation left, editor + settings right; quick-open (Ctrl+P) library    (side by side)
  The floating bar also sets how the notation wraps (fit width / 4 / 2 bars per line).
  Playback is real but rough (synth sounds, setInterval scheduler). Nothing is saved.
-->
<script src="vexflow.js"></script>
<style>
  :root { --accent:#2563eb; --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --mute:#78716c; --line:#e7e5e4; --ov:#c2410c; --sel:#dbeafe; --loop:#fef3c7; --play:#dc2626; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; overflow:hidden; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 9px; cursor:pointer; color:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--sel); border-color:var(--accent); }
  select, input { font:inherit; }
  input[type=number] { width:58px; padding:2px 4px; }
  input[type=range] { vertical-align:middle; }
  kbd { font:11px ui-monospace, monospace; background:#f5f5f4; border:1px solid #d6d3d1; border-bottom-width:2px; border-radius:4px; padding:0 4px; }
  .mute { color:var(--mute); }
  h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:0 0 6px; }

  /* shared widgets */
  .notation { position:relative; }
  .notation svg { display:block; }
  .notation .vf-stavenote { cursor:pointer; }
  .notation .playing path, .notation .playing text { fill:var(--play) !important; stroke:var(--play); }
  .barno { position:absolute; font:11px ui-monospace, monospace; padding:0 5px; border-radius:4px; color:var(--mute); background:transparent; border:1px solid transparent; z-index:2; }
  .barno:hover { border-color:var(--accent); color:var(--accent); }
  .barno.inloop { background:#f59e0b; color:#fff; }
  .play { width:40px; height:40px; border-radius:50%; font-size:16px; background:var(--ink); color:#fff; border:none; flex:none; }
  .play.on { background:var(--play); }
  .pos { font:12px ui-monospace, monospace; min-width:112px; color:var(--mute); }
  .fld { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .fld > span.l { color:var(--mute); font-size:12px; }
  .swp { display:flex; gap:3px; } .swp button { font-size:11px; padding:0 6px; } .swp button.on { background:var(--sel); border-color:var(--accent); }
  .loopro { white-space:nowrap; font-size:13px; }
  .loopro button { padding:0 5px; font-size:11px; }
  .modeind { font:600 12px ui-monospace, monospace; padding:2px 8px; border-radius:4px; background:#dcfce7; color:#166534; white-space:nowrap; }
  .modeind.normal { background:#e0e7ff; color:#3730a3; }
  .namein { font:600 17px system-ui; border:1px solid transparent; background:transparent; padding:2px 6px; border-radius:6px; min-width:120px; }
  .namein:hover, .namein:focus { border-color:var(--line); background:#fff; }

  .strip { display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; }
  .cbar { display:flex; gap:3px; border:1px solid var(--line); border-radius:8px; padding:3px 4px; background:#fff; align-items:center; }
  .cbar.inloop { background:var(--loop); }
  .cbar { position:relative; } .delbar { position:absolute; right:-7px; top:-8px; width:18px; height:18px; padding:0; border-radius:50%; font-size:10px; display:none; color:#b91c1c; }
  .cbar:hover .delbar { display:block; }
  .cbar .bn { font:11px ui-monospace, monospace; color:var(--mute); width:18px; text-align:right; margin-right:2px; }
  .cbeat { width:40px; height:36px; border:1px solid #d6d3d1; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font:10px ui-monospace, monospace; position:relative; background:#fff; line-height:1.1; }
  .cbeat b { font-size:14px; }
  .cbeat.cur { outline:3px solid var(--accent); outline-offset:-2px; }
  .cbeat .tie { position:absolute; top:-8px; left:-8px; font-size:14px; color:var(--accent); }
  .notation .cbeat { position:absolute; height:34px; }

  .pal { display:flex; flex-direction:column; gap:5px; }
  .pal .row { display:flex; gap:5px; }
  .pal .row.r1 { padding-left:18px; } .pal .row.r2 { padding-left:36px; }
  .fig { border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; text-align:center; position:relative; padding:0; }
  .fig:hover { border-color:var(--accent); }
  .fig.on { border-color:var(--accent); background:var(--sel); }
  .fig .k { position:absolute; left:3px; top:1px; font:600 11px ui-monospace, monospace; color:var(--mute); }
  .fig .mini { overflow:hidden; pointer-events:none; }
  .pal.tiles .fig { width:74px; height:52px; }
  .pal.tiles .fig .p { display:none; }
  .pal.tiles .fig .mini { height:52px; } .pal.tiles .fig .mini svg { transform:scale(.5); transform-origin:2px -4px; }
  .pal.compact .fig { width:44px; height:34px; } .pal.compact .fig .mini { display:none; }
  .pal.compact .fig .k { position:static; display:block; font-size:12px; color:var(--ink); }
  .pal.compact .fig .p { font:9px ui-monospace, monospace; color:var(--mute); }
  .pal.compact .row.r1 { padding-left:12px; } .pal.compact .row.r2 { padding-left:24px; }
  .pal .fig.wide { width:auto; padding:0 10px; }
  .pal.tiles .fig.wide .k { position:static; display:block; margin-top:8px; }

  .legend { font-size:12px; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 10px; columns:2; column-gap:20px; }
  .legend div { break-inside:avoid; }
  .legend b { font-family:ui-monospace, monospace; }

  .lib-head { display:flex; flex-direction:column; gap:6px; }
  .lib-head input { width:100%; padding:4px 8px; border:1px solid #d6d3d1; border-radius:6px; }
  .lib-acts { display:flex; flex-wrap:wrap; gap:4px; }
  .lib-acts button { font-size:12px; padding:1px 7px; }
  .lib-items { overflow:auto; }
  .li { display:flex; gap:6px; align-items:center; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .li:hover { background:#f5f5f4; }
  .li.open { background:var(--sel); }
  .li .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li .meta { font-size:11px; color:var(--mute); white-space:nowrap; }
  table.libt { width:100%; border-collapse:collapse; }
  table.libt th { text-align:left; font-size:11px; text-transform:uppercase; color:var(--mute); padding:6px 8px; border-bottom:1px solid var(--line); }
  table.libt td { padding:8px; border-bottom:1px solid var(--line); cursor:pointer; }
  table.libt tr:hover td { background:#fafaf9; }
  table.libt tr.open td { background:var(--sel); }

  .toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:8px 14px; border-radius:8px; z-index:99; font-size:13px; }

  /* ===== Variant A: workstation ===== */
  .va { display:grid; grid-template-columns:230px 1fr 250px; height:100vh; }
  .va-lib { border-right:1px solid var(--line); background:#fafaf9; padding:12px 10px; display:flex; flex-direction:column; gap:8px; min-height:0; }
  .va-lib .lib-items { flex:1; }
  .va-main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .va-top { display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:1px solid var(--line); background:#fff; flex-wrap:wrap; }
  .va-score { flex:1; overflow:auto; padding:10px 16px; background:#fff; min-height:0; }
  .va-edit { border-top:1px solid var(--line); padding:8px 16px 70px; background:#fafaf9; display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow:auto; }
  .va-edit .hd { display:flex; gap:10px; align-items:center; }
  .va-set { border-left:1px solid var(--line); background:#fafaf9; padding:12px; display:flex; flex-direction:column; gap:14px; overflow:auto; }
  .va-set .grp { display:flex; flex-direction:column; gap:6px; }
  .va-set .fld { justify-content:space-between; }
  .va-set input[type=range] { width:120px; }

  /* ===== Variant B: practice / edit ===== */
  .vb { display:flex; flex-direction:column; height:100vh; }
  .vb-top { display:flex; align-items:center; gap:12px; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); }
  .vb-tabs { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-left:auto; }
  .vb-tabs button { border:none; border-radius:0; padding:5px 16px; }
  .vb-tabs button.on { background:var(--ink); color:#fff; }
  .vb-score { flex:1; overflow:auto; padding:20px 28px; background:#fff; min-height:0; }
  .vb-dock { border-top:1px solid var(--line); background:#fafaf9; padding:10px 18px 64px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 24px; }
  .vb-dock .sep { width:1px; height:28px; background:var(--line); }
  .vb-dock input[type=range] { width:90px; }
  .vb-mirror { height:34vh; overflow:auto; padding:8px 20px; background:#fff; border-bottom:1px solid var(--line); }
  .vb-editor { flex:1; display:grid; grid-template-columns:1fr auto; gap:14px; padding:12px 20px 70px; overflow:auto; min-height:0; }
  .vb-editor .left { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .vb-drawer-bg { position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:20; }
  .vb-drawer { position:fixed; left:0; top:0; bottom:0; width:340px; background:#fff; z-index:21; padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:4px 0 24px rgba(0,0,0,.15); }
  .vb-drawer .lib-items { flex:1; }

  /* ===== Variant C: score first ===== */
  .vc { display:flex; flex-direction:column; height:100vh; }
  .vc-top { display:flex; align-items:center; gap:10px; padding:6px 14px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pop { position:relative; }
  .pop summary { list-style:none; cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:13px; white-space:nowrap; background:#fff; }
  .pop summary::-webkit-details-marker { display:none; }
  .pop[open] summary { border-color:var(--accent); }
  .pop .body { position:absolute; top:calc(100% + 6px); left:0; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:15; display:flex; flex-direction:column; gap:8px; min-width:230px; }
  .pop .body .fld { justify-content:space-between; }
  .vc-score { flex:1; overflow:auto; padding:14px 22px; background:#fff; min-height:0; }
  .vc-pal { position:fixed; left:50%; bottom:62px; transform:translateX(-50%); background:#fafaf9; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.15); padding:8px 10px; z-index:10; display:flex; gap:12px; align-items:flex-start; }
  .vc-lib { flex:1; overflow:auto; padding:20px 40px 80px; background:#fff; }
  .vc-lib .lib-head { flex-direction:row; align-items:center; margin-bottom:10px; }
  .vc-lib .lib-head input { max-width:320px; }

  /* ===== Variant D: side by side ===== */
  .vd { display:flex; flex-direction:column; height:100vh; }
  .vd-top { display:flex; align-items:center; gap:12px; padding:6px 14px; background:#fff; border-bottom:1px solid var(--line); }
  .vd-switch { font:600 16px system-ui; border:1px solid var(--line); border-radius:8px; padding:4px 12px; background:#fff; max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vd-body { flex:1; display:grid; grid-template-columns:1fr 400px; min-height:0; }
  .vd-left { display:flex; flex-direction:column; min-width:0; min-height:0; border-right:1px solid var(--line); }
  .vd-trans { display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:1px solid var(--line); background:#fafaf9; flex-wrap:wrap; }
  .vd-score { flex:1; overflow:auto; padding:10px 16px 70px; background:#fff; min-height:0; }
  .vd-right { overflow:auto; padding:10px 12px 70px; display:flex; flex-direction:column; gap:12px; background:#fafaf9; }
  .vd-right .strip { flex-direction:column; flex-wrap:nowrap; }
  .vd-right details { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .vd-right details summary { cursor:pointer; font-size:13px; font-weight:600; }
  .vd-right details .body { display:flex; flex-direction:column; gap:7px; padding:8px 0 4px; }
  .vd-right details .fld { justify-content:space-between; }
  .vd-qo-bg { position:fixed; inset:0; background:rgba(0,0,0,.2); z-index:20; }
  .vd-qo { position:fixed; top:70px; left:50%; transform:translateX(-50%); width:520px; background:#fff; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.25); z-index:21; padding:10px; display:flex; flex-direction:column; gap:6px; max-height:70vh; }
  .vd-qo > input { font-size:16px; padding:8px 10px; border:1px solid #d6d3d1; border-radius:6px; }
  .vd-qo .lib-items { max-height:50vh; }
  .vd-qo .li.hi { outline:2px solid var(--accent); }

  /* floating prototype bar (prototype chrome, not part of any design) */
  #switcher { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; background:#111827; color:#fff; border-radius:99px; padding:5px 8px; box-shadow:0 6px 24px rgba(0,0,0,.3); z-index:50; font-size:12px; white-space:nowrap; }
  #switcher button { background:#374151; color:#fff; border:none; border-radius:99px; min-width:28px; height:28px; padding:0 8px; }
  #switcher select { background:#374151; color:#fff; border:none; border-radius:6px; font-size:12px; padding:3px; }
  #vlabel { min-width:170px; text-align:center; }
  #switcher .badge { background:#dc2626; border-radius:99px; padding:1px 7px; font-weight:700; font-size:10px; }
  #statepanel { position:fixed; right:12px; bottom:58px; width:420px; max-height:60vh; overflow:auto; background:#111827; color:#e5e7eb; font:11px/1.45 ui-monospace, monospace; white-space:pre-wrap; padding:10px; border-radius:8px; z-index:50; }
</style>
</head>

<div id="app"></div>
<div id="switcher">
  <span class="badge">PROTOTYPE</span>
  <button id="prev" title="Previous layout (Alt+←)">←</button><span id="vlabel"></span><button id="next" title="Next layout (Alt+→)">→</button>
  <label>Wrap <select id="wrap"><option value="4">4 bars/line</option><option value="fit">fit width</option><option value="2">2 bars/line</option></select></label>
  <button id="statebtn" title="Show the state">state</button>
  <span id="vp" style="color:#9ca3af"></span>
</div>
<pre id="statepanel" hidden></pre>
<script>
'use strict';
const VF = VexFlow;
const TPB = 12, BAR = 48; // 12 ticks per beat: sixteenth 3, triplet eighth 4
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---------- model (from the grid editor prototype) ----------
let uid = 1;
const mk = (t, o = {}) => ({ id: uid++, t, rest: !!o.rest, tie: !!o.tie, trip: !!o.trip, ov: o.ov || null });
const clone = bars => bars.map(b => ({ items: b.items.map(i => ({ ...i })), subs: [...b.subs] }));
const emptyBar = () => ({ items: [0, 1, 2, 3].map(() => mk(12, { rest: true })), subs: [2, 2, 2, 2] });
function flatten(bars) {
  const out = []; let prev = null;
  bars.forEach((b, bi) => { let p = 0; b.items.forEach((it, ii) => {
    out.push({ it, bi, ii, start: p, cont: !!(prev && prev.tie && !prev.rest && !it.rest) });
    prev = it; p += it.t; }); });
  return out;
}
const barTicks = b => b.items.reduce((s, i) => s + i.t, 0);
function sticking(ex) {
  const bars = ex.bars;
  const res = new Map(); const fl = flatten(bars); const other = ex.lead === 'R' ? 'L' : 'R';
  const struck = fl.filter(f => !f.it.rest && !f.cont);
  if (ex.mode === 'off') return res;
  if (ex.mode === 'alternate') { struck.forEach((f, i) => res.set(f.it.id, { hand: f.it.ov || (i % 2 ? other : ex.lead), ov: !!f.it.ov })); return res; }
  let run = 0, prevTrip = false;
  bars.forEach((b, bi) => {
    for (let beat = 0; beat < 4; beat++) {
      const inBeat = fl.filter(f => f.bi === bi && Math.floor(f.start / TPB) === beat);
      const trip = inBeat.some(f => f.it.trip);
      if (trip) { if (!prevTrip) run = 0; inBeat.forEach(f => { const k = run + (f.start % TPB) / 4; f.hand = k % 2 ? other : ex.lead; }); run += 3; prevTrip = true; }
      else { const offs = inBeat.map(f => f.start % TPB); const step = offs.some(o => o % 6) ? 3 : offs.some(o => o === 6) ? 6 : 12;
        inBeat.forEach(f => { f.hand = ((f.start % TPB) / step) % 2 ? other : ex.lead; }); prevTrip = false; }
    }
  });
  struck.forEach(f => res.set(f.it.id, { hand: f.it.ov || f.hand, ov: !!f.it.ov }));
  return res;
}
function tok(it) {
  const base = it.trip ? { 8: 'q', 4: 'e' }[it.t] : { 18: 'q.', 12: 'q', 9: 'e.', 6: 'e', 3: 's' }[it.t];
  return (it.rest ? 'r' : '') + base + (it.ov ? it.ov : '') + (it.tie && !it.rest ? '~' : '');
}
function barText(b) {
  const out = []; let p = 0, grp = null;
  b.items.forEach(it => {
    if (it.trip) { if (!grp || Math.floor(p / TPB) !== grp.beat) { grp = { beat: Math.floor(p / TPB), toks: [] }; out.push(grp); } grp.toks.push(tok(it)); }
    else { grp = null; out.push(tok(it)); }
    p += it.t;
  });
  return out.map(x => typeof x === 'string' ? x : '[' + x.toks.join(' ') + ']').join(' ');
}
const toText = bars => bars.map(barText).join(' | ');
function parseText(src) { // samples only; assumes valid input
  const bars = []; let cur = { items: [], subs: [2, 2, 2, 2] }; let inTrip = false;
  for (const s of src.match(/\||\[|\]|[^\s|\[\]]+/g)) {
    if (s === '|') { bars.push(cur); cur = { items: [], subs: [2, 2, 2, 2] }; continue; }
    if (s === '[') { inTrip = true; continue; } if (s === ']') { inTrip = false; continue; }
    const t = /^(r?)([qes])(\.?)(~?)$/.exec(s); const rest = !!t[1], d = t[2], dot = !!t[3], tie = !!t[4];
    const ticks = inTrip ? (d === 'q' ? 8 : 4) : { q: 12, e: 6, s: 3 }[d] * (dot ? 1.5 : 1);
    cur.items.push(mk(ticks, { rest, tie, trip: inTrip }));
  }
  bars.push(cur); return bars;
}
function toCells(bars) {
  const fl = flatten(bars);
  return bars.map((b, bi) => {
    const mine = fl.filter(f => f.bi === bi);
    return [0, 1, 2, 3].map(beat => {
      const lo = beat * TPB, hi = lo + TPB;
      const covering = c => mine.find(f => f.start <= c && c < f.start + f.it.t);
      const starts = mine.filter(f => f.start >= lo && f.start < hi);
      const trip = starts.some(f => f.it.trip) || !!(covering(lo) && covering(lo).it.trip);
      const need16 = starts.some(f => f.start % 6);
      const sub = trip ? 3 : need16 || b.subs[beat] === 4 ? 4 : 2;
      const len = TPB / sub, st = [], ov = [];
      for (let k = 0; k < sub; k++) {
        const c = lo + k * len, f = covering(c);
        if (!f || f.it.rest) { st.push('.'); ov.push(null); }
        else if (f.start === c && !f.cont) { st.push('x'); ov.push(f.it.ov); }
        else { st.push('-'); ov.push(null); }
      }
      return { sub, st, ov };
    });
  });
}
function okNote(p, L) { const o = p % TPB; if (L === 18 || L === 12) return p % 6 === 0; if (L === 9) return o === 0 || o === 3; if (L === 6) return p % 6 === 0 || o === 3; return true; }
function okRest(p, L) { const o = p % TPB; if (L === 12) return o === 0; if (L === 9) return o === 0 || o === 3; if (L === 6) return o === 0 || o === 6 || o === 3; return true; }
function spell(p, end, rest, trip) {
  const out = [];
  while (p < end) { let L;
    if (trip) L = (p % TPB === 0 || p % TPB === 4) && p + 8 <= end ? 8 : 4;
    else L = [18, 12, 9, 6, 3].find(L => p + L <= end && (rest ? okRest(p, L) : okNote(p, L)));
    out.push(L); p += L; }
  return out;
}
function fromCells(barsCells) {
  const cells = []; const tripBeat = [];
  barsCells.forEach((bc, bi) => bc.forEach((beat, k) => {
    const g0 = bi * BAR + k * TPB;
    const trip = beat.sub === 3 && !(beat.st[1] === '-' && beat.st[2] === '-') && !beat.st.every(s => s === '.');
    tripBeat[g0 / TPB] = trip;
    beat.st.forEach((s, j) => cells.push({ g: g0 + j * TPB / beat.sub, len: TPB / beat.sub, s, ov: beat.ov[j] }));
  }));

    },
    key: e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') { st.screen = st.screen === 'lib' ? 'ex' : 'lib'; st.from = true; renderAll(); return true; }
      if (st.screen === 'lib' && e.key === 'Escape') { st.screen = 'ex'; renderAll(); return true; }
      return false;
    },
    follow: id => followScroll($('.vc-score'), id),
  };
}

// D: notation left, editor + settings right. Library by quick-open (Ctrl+P) on the name; management in the same box.
function makeD() {
  const st = makeD.st || (makeD.st = { qo: false, hi: 0 });
  function build() {
    app.innerHTML = `<div class="vd">
      <header class="vd-top"><button class="vd-switch" data-act="qo" title="Switch exercise (Ctrl+P)"><span data-show="name"></span> ▾</button><span class="mute" style="font-size:12px"><kbd>Ctrl</kbd>+<kbd>P</kbd> switch · rename in the box on the right</span><span style="margin-left:auto">${W.modeInd()}</span></header>
      <div class="vd-body">
        <section class="vd-left"><div class="vd-trans">${W.play()}${W.pos()}${W.bpm()}${W.countIn()}${W.loop()}</div><div class="vd-score"><div class="notation js-score"></div></div></section>
        <aside class="vd-right">
          <div style="display:flex;gap:6px;align-items:center"><span class="mute" style="font-size:12px">Name</span>${W.name()}</div>
          <div><h3>Bars</h3><div class="strip js-strip" data-scrollcur="1" style="max-height:30vh;overflow:auto"></div></div>
          ${W.palette('compact')}${W.legend()}
          <details open><summary>Groove</summary><div class="body">${W.groove()}${W.swing()}</div></details>
          <details><summary>Sticking & voice</summary><div class="body">${W.sticking()}${W.voice()}</div></details>
          <details><summary>Volume</summary><div class="body">${W.vols()}</div></details>
        </aside></div></div>
      ${st.qo ? `<div class="vd-qo-bg" data-act="qo"></div><div class="vd-qo"><input placeholder="Type to filter exercises · ↑↓ Enter" data-libfilter data-qo="1">${W.libItems()}<div class="lib-acts" style="border-top:1px solid var(--line);padding-top:6px"><button data-lib="new">New</button><button data-lib="dup">Duplicate current</button><button data-lib="import">Import…</button><button data-lib="exportsel">Export selected</button><button data-lib="exportall">Export all</button><button data-lib="delsel">Delete selected</button></div></div>` : ''}`;
    $('.vd-right select[data-set=groove]').style.width = '200px';
    if (st.qo) setTimeout(() => { const i = $('[data-qo]'); if (i) { i.value = ui.filter; i.focus(); } });
  }
  build();
  const hi = () => { $$('.vd-qo .li').forEach((el, i) => el.classList.toggle('hi', i === st.hi)); };
  return {
    rebuild: build, editing: () => !st.qo,
    afterScore: () => st.qo && hi(),
    act: a => {
      if (a === 'qo') { st.qo = !st.qo; st.hi = 0; ui.filter = ''; renderAll(); return true; }
      if (a === 'opened') { st.qo = false; ui.filter = ''; renderAll(); return true; }
    },
    key: e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { st.qo = !st.qo; st.hi = 0; ui.filter = ''; renderAll(); return true; }
      if (!st.qo) return false;
      const n = sortedLib().length;
      if (e.key === 'Escape') { st.qo = false; ui.filter = ''; renderAll(); return true; }
      if (e.key === 'ArrowDown') { st.hi = Math.min(n - 1, st.hi + 1); hi(); return true; }
      if (e.key === 'ArrowUp') { st.hi = Math.max(0, st.hi - 1); hi(); return true; }
      if (e.key === 'Enter') { const t = sortedLib()[st.hi]; if (t) { openEx(t.id); st.qo = false; ui.filter = ''; renderAll(); } return true; }
      return false;
    },
    keyInField: true,
    afterFilter: () => { st.hi = 0; hi(); },
    follow: id => followScroll($('.vd-score'), id),
  };
}

// ---------- events ----------
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.set) set(el.dataset.set, el.type === 'checkbox' ? el.checked : el.value, el);
  if (el.matches('[data-libfilter]')) { ui.filter = el.value; renderLib(); active.afterFilter && active.afterFilter(); }
});
document.addEventListener('change', e => { if (e.target.matches('select[data-set]')) e.target.blur(); if (e.target.dataset.check) { const id = e.target.dataset.check; e.target.checked ? ui.checked.add(id) : ui.checked.delete(id); renderState(); } });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('[data-check]')) { e.stopPropagation(); return; }
  const actEl = t.closest('[data-act]');
  if (actEl) { const a = actEl.dataset.act;
    if (active.act && active.act(a, actEl)) return;
    if (a === 'play') { toggle(); actEl.blur(); return; }
    if (a === 'loopclear') { ex.loop = null; renderScore(); if (player.on) { stop(); play(); } return; }
  }
  const sp = t.closest('[data-swingp]'); if (sp) { set('swing', sp.dataset.swingp); return; }
  const db = t.closest('[data-delbar]'); if (db) { ui.cur = { bar: +db.dataset.delbar, beat: 0 }; barAct('del'); return; }
  const lb = t.closest('[data-loopbar]');
  if (lb) { const bi = +lb.dataset.loopbar;
    if (e.shiftKey && ex.loop) ex.loop = [Math.min(ex.loop[0], bi), Math.max(ex.loop[1], bi)];
    else ex.loop = ex.loop && ex.loop[0] === bi && ex.loop[1] === bi ? null : [bi, bi];
    renderScore(); if (player.on) { stop(); play(); } return; }
  const c = t.closest('[data-c]');
  if (c) { const [bar, beat] = c.dataset.c.split(',').map(Number); ui.cur = { bar, beat }; renderScore(); return; }
  const fig = t.closest('[data-fig]');
  if (fig) { const k = fig.dataset.fig; putFig(k === ' ' ? '....' : FIGS.find(f => f.k === k).p); fig.blur(); return; }
  const key = t.closest('[data-key]');
  if (key) { key.dataset.key === 't' ? toggleTie() : (ui.legend = !ui.legend, renderScore()); key.blur(); return; }
  const lb2 = t.closest('[data-lib]');
  if (lb2) { libAction(lb2.dataset.lib, lb2.dataset.arg); return; }
  const op = t.closest('[data-open]');
  if (op) { openEx(op.dataset.open); active.act && active.act('opened'); return; }
});
document.addEventListener('dblclick', e => { const li = e.target.closest('.li[data-open]'); if (li) libAction('rename', li.dataset.open); });
document.addEventListener('keydown', e => {
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { cycle(e.key === 'ArrowLeft' ? -1 : 1); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.code === 'Space') { toggle(); e.preventDefault(); return; }
  const inField = !!e.target.matches && e.target.matches('input:not([type=checkbox]):not([type=range]), textarea, select');
  if (active.key && (!inField || active.keyInField) && active.key(e)) { e.preventDefault(); return; }
  if (inField) { if (e.key === 'Escape' || e.key === 'Enter') e.target.blur(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); e.preventDefault(); return; }
  if (active.editing() && editorKey(e)) e.preventDefault();
});

// ---------- prototype shell ----------
function setVariant(key) {
  const i = Math.max(0, VARIANTS.findIndex(v => v.key === key)), v = VARIANTS[i];
  const u = new URL(location.href); u.searchParams.set('variant', v.key); window.history.replaceState(null, '', u);
  $('#vlabel').textContent = `${v.key} · ${v.name}  (${i + 1}/${VARIANTS.length})`;
  active = { def: v }; Object.assign(active, v.make(), { def: v }); renderAll();
}
function cycle(d) { const i = VARIANTS.findIndex(v => v.key === active.def.key); setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key); }
$('#prev').onclick = () => cycle(-1); $('#next').onclick = () => cycle(1);
$('#wrap').onchange = e => { ui.wrap = e.target.value; e.target.blur(); renderScore(); };
$('#statebtn').onclick = () => { $('#statepanel').hidden = !$('#statepanel').hidden; renderState(); };
const showVp = () => $('#vp').textContent = `${innerWidth}×${innerHeight}`;
let rz; window.addEventListener('resize', () => { showVp(); clearTimeout(rz); rz = setTimeout(renderScore, 150); });

VF.loadFonts('Bravura', 'Academico').then(() => {
  VF.setFonts('Bravura', 'Academico');
  const q = new URLSearchParams(location.search);
  if (q.get('wrap')) { ui.wrap = q.get('wrap'); $('#wrap').value = ui.wrap; }
  showVp(); setVariant(q.get('variant') || 'A');
});
</script>
</body>
