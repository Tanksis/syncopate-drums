<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Syncopate!</title>
    <script>
      // Applies the look and mode before the first paint, so a launch shows no frame of the wrong
      // look, or a light frame in dark. The app mirrors its look and mode settings to these keys
      // (src/app/theme.ts); without them, Studio, following the device. A light-only look draws light
      // whatever the mode (drawnMode in src/core/model.ts; keep the lists in step with LOOKS there).
      ;(function () {
        var look, theme
        try {
          look = localStorage.getItem('syncopate-look')
          theme = localStorage.getItem('syncopate-theme')
        } catch (e) {}
        if (['studio', 'warm', 'bold', 'score', 'riso', 'catalogue'].indexOf(look) < 0) look = 'studio'
        if (['score', 'riso', 'catalogue'].indexOf(look) >= 0) theme = 'light'
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.look = look
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
